name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'https://github.com/ma7job2025-hue/ma7job'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - run: dotnet restore ${{ env.PROJECT_PATH }}
    - run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
    - run: dotnet test ${{ env.PROJECT_PATH }} --no-build --verbosity normal
      continue-on-error: true
    - run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ./publish --self-contained true -r win-x64
    - uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: ./publish/
        retention-days: 30
